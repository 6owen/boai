appId: com.boai.desktop
productName: BoAI
copyright: Copyright © 2026 BoAI contributors

electronVersion: "39.2.7"

# Keep Chromium/Electron locale payloads aligned with BoAI's supported UI languages.
electronLanguages:
  - en-US
  - zh-CN

# Hook to compile macOS 26+ Liquid Glass icon after packaging
afterPack: scripts/afterPack.cjs

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - "!dist/renderer/src/**"
  - "!**/*.map"
  - package.json
  # Runtime resources, MCP helpers, PI server, document wrappers and the target uv
  # are staged once under dist/resources/ by electron-build-resources.ts.
  # Runtime dependencies are staged explicitly through extraResources.
  - "!node_modules/**/*"

extraMetadata:
  # Keep the workspace package name internal to the monorepo. The packaged
  # application/updater must use the BoAI identity for data and cache paths.
  name: boai
  main: dist/main.cjs

# Generate GitHub Release update manifests (latest.yml, latest-mac.yml, and
# latest-linux.yml) and embed the matching provider in packaged applications.
publish:
  provider: github
  owner: 6owen
  repo: boai
  releaseType: release

# Disable ASAR to avoid decompression overhead and click delays
asar: false

mac:
  # Electron's macOS distribution uses .lproj directory names rather than
  # the BCP-47 locale names used by Windows and Linux.
  electronLanguages:
    - en
    - zh_CN
  category: public.app-category.productivity
  icon: resources/icon.icns
  # macOS 26+ Liquid Glass: Tell macOS to look for icon in Assets.car
  # The value must match --app-icon used in actool (see afterPack.js)
  extendInfo:
    CFBundleIconName: AppIcon
    # Required for macOS to list the app under Privacy & Security > Local Network
    # and prompt for permission. Without it the app is silently denied LAN access
    # and never appears in the privacy pane (craft-agents-oss#938).
    NSLocalNetworkUsageDescription: "BoAI uses your local network to reach LAN addresses and devices you ask an agent to access, such as local servers or APIs."
  target:
    # Architecture is selected by build-dmg.sh (`--arm64` or `--x64`).
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    # ripgrep (used by packages/server-core/src/services/search.ts).
    - from: node_modules/@vscode/ripgrep
      to: app/node_modules/@vscode/ripgrep
    # WhatsApp worker subprocess (self-contained; Baileys bundled in).
    - from: ../../packages/messaging-whatsapp-worker/dist/worker.cjs
      to: messaging-whatsapp-worker/worker.cjs
  # Use predictable naming for BoAI macOS packages (applies to zip; dmg uses its own config below)
  artifactName: "BoAI-${arch}.${ext}"
  # Code signing & notarization (disabled by default for local builds)
  # To enable: set CSC_LINK, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
  # notarize:
  #   teamId: ${APPLE_TEAM_ID}

dmg:
  # Use predictable naming: BoAI-arm64.dmg, BoAI-x64.dmg
  artifactName: "BoAI-${arch}.dmg"
  # Custom background. electron-builder combines this 1x PNG with the
  # matching @2x PNG and uses the 1x dimensions for the Finder window.
  background: resources/dmg-background.png
  # Use app icon as the mounted volume icon in Finder
  icon: resources/icon.icns
  iconSize: 80
  title: "BoAI"
  contents:
    - x: 130
      y: 200
    - x: 410
      y: 200
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    # Portable/green distribution: extract the ZIP and run BoAI.exe directly.
    - target: zip
      arch:
        - x64
  # Use predictable naming: BoAI-x64.exe and BoAI-x64.zip
  artifactName: "BoAI-${arch}.${ext}"
  files:
    # Platform-level file filters replace the root filter in electron-builder,
    # so repeat the positive runtime allowlist before excluding Windows uv.
    - dist/**/*
    - "!dist/renderer/src/**"
    - "!**/*.map"
    - package.json
    - "!node_modules/**/*"
    # Copy the large main bundle separately below. electron-builder's parallel
    # Windows file copier can repeatedly lock this freshly generated file.
    - "!dist/main.cjs"
    # WORKAROUND: Exclude uv from regular files on Windows.
    # electron-builder's npm node module collector causes EBUSY errors when copying
    # .exe files because it scans/locks files while simultaneously trying to copy them.
    # Moving them to extraResources avoids this by copying before the collector runs.
    # See: https://github.com/electron-userland/electron-builder/issues/8250
    - "!dist/resources/bin/win32-x64/**"
  # Copy executables as extraResources to avoid EBUSY file locking (see comment above)
  extraResources:
    - from: dist/main.cjs
      to: app/dist/main.cjs
    - from: node_modules/@vscode/ripgrep
      to: app/node_modules/@vscode/ripgrep
    - from: dist/resources/bin/win32-x64
      to: app/dist/resources/bin/win32-x64
    # WhatsApp worker subprocess (self-contained; Baileys bundled in).
    - from: ../../packages/messaging-whatsapp-worker/dist/worker.cjs
      to: messaging-whatsapp-worker/worker.cjs

nsis:
  # Assisted mode exposes the installation-directory page.
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Per-user install to %LOCALAPPDATA%\Programs\ (not Program Files).
  # Users can choose another writable directory in the installer.
  perMachine: false
  shortcutName: BoAI
  uninstallDisplayName: BoAI
  deleteAppDataOnUninstall: true

linux:
  icon: resources/icon.png
  category: Utility
  maintainer: "BoAI contributors"
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: "BoAI-${arch}.${ext}"
  extraResources:
    - from: node_modules/@vscode/ripgrep
      to: app/node_modules/@vscode/ripgrep
    # WhatsApp worker subprocess (self-contained; Baileys bundled in).
    - from: ../../packages/messaging-whatsapp-worker/dist/worker.cjs
      to: messaging-whatsapp-worker/worker.cjs
