name: Release desktop apps

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Verify versions and prepare release tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${VERSION}"
          CURRENT_SHA=$(git rev-parse HEAD)

          if [ -n "$REQUESTED_TAG" ] && [ "$REQUESTED_TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag $REQUESTED_TAG does not match package version $VERSION" >&2
            exit 1
          fi

          bun run check-version
          echo "tag=$EXPECTED_TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse --verify --quiet "refs/tags/${EXPECTED_TAG}^{}" >/dev/null; then
            TAG_SHA=$(git rev-parse "refs/tags/${EXPECTED_TAG}^{}")
            if [ "$TAG_SHA" != "$CURRENT_SHA" ]; then
              if [ "$EVENT_NAME" = "workflow_run" ]; then
                echo "should_release=false" >> "$GITHUB_OUTPUT"
                echo "::notice title=Release skipped::$EXPECTED_TAG already points to $TAG_SHA. Bump the package version to publish $CURRENT_SHA."
                exit 0
              fi

              echo "Tag $EXPECTED_TAG does not point to the checked-out commit $CURRENT_SHA" >&2
              exit 1
            fi
          else
            if [ "$EVENT_NAME" != "workflow_run" ]; then
              echo "Tag $EXPECTED_TAG does not exist" >&2
              exit 1
            fi

            git tag "$EXPECTED_TAG" "$CURRENT_SHA"
            git push origin "refs/tags/${EXPECTED_TAG}:refs/tags/${EXPECTED_TAG}"
          fi

          RELEASE_DRAFT=$(gh release view "$EXPECTED_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$RELEASE_DRAFT" = "false" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release skipped::$EXPECTED_TAG is already published. Bump the package version for the next release."
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes --title "BoAI $TAG"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build macOS arm64 package
        if: matrix.platform == 'mac'
        working-directory: apps/electron
        run: bun run dist:mac
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BOAI_SKIP_INSTALL: "1"

      - name: Build Windows x64 package
        if: matrix.platform == 'win'
        working-directory: apps/electron
        shell: pwsh
        run: ./scripts/build-win.ps1
        env:
          BOAI_SKIP_INSTALL: "1"

      - name: Save Electron artifact size report
        uses: actions/upload-artifact@v4
        with:
          name: electron-size-report-${{ matrix.platform }}
          path: apps/electron/release/artifact-report-*.json
          if-no-files-found: error

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          shopt -s nullglob
          assets=(
            apps/electron/release/*.dmg
            apps/electron/release/*.zip
            apps/electron/release/*.exe
            apps/electron/release/*.blockmap
            apps/electron/release/latest*.yml
          )
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets were produced" >&2
            exit 1
          fi
          gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
